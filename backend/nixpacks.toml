# backend/nixpacks.toml
# Epic 4B Slice 2 (E4B-S2-BE-02, R-29) — Railway deploys this service via
# Nixpacks buildpack auto-detect (Procfile + requirements.txt, no
# Dockerfile). WeasyPrint needs these system libraries at runtime; without
# them `import weasyprint` succeeds (pure-Python) but PDF generation
# crashes with a Cairo/Pango loader error on first call.
#
# fonts-liberation: without it PDFs render with a default fallback font
# instead of a clean sans-serif — matches libs already verified locally
# (Ubuntu 22.04 dev environment has all of these installed).

[phases.setup]
aptPkgs = [
    "libcairo2",
    "libpango-1.0-0",
    "libpangocairo-1.0-0",
    "libgdk-pixbuf-2.0-0",
    "libffi-dev",
    "shared-mime-info",
    "fonts-liberation",
]
